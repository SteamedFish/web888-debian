[Unit]
# Reverse PL-exclusivity conflict: starting WebSDR stops any known
# RP app instance. systemd cannot glob template instances in Conflicts=, so
# the instances are listed explicitly; keep in sync with the shipped apps.
Conflicts=web888-rpapp@led_blinker.service web888-rpapp@sdr_receiver.service web888-rpapp@sdr_receiver_hpsdr.service web888-rpapp@sdr_transceiver_wide.service
