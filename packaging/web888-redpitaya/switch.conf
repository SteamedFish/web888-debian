# web888-redpitaya switch configuration (dist default, conffile).
# Read by /usr/lib/web888-redpitaya/load-bitstream before each PL load.

# SI5351_RESET=1 re-initialises the Si5351 ADC clock generator (via
# /usr/lib/web888-redpitaya/si5351-init) before loading an RP bitstream.
# RP apps never touch Si5351 and assume the FSBL-programmed clock; WebSDR
# re-programs it, so switching websdr -> RP app MAY require a clock restore.
# Default 0 until the hardware measurement settles the requirement;
# flip based on docs/research/hardware-facts.md evidence.
SI5351_RESET=0
