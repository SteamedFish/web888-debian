# Dependency-library watch list for scripts/ci/check-deps.sh (used by
# .github/workflows/upstream-watch.yml).
#
# Format: `<pkg-key>: <lib> <lib> ...` — the trixie armhf runtime library
# binary packages each published package links against (via
# ${shlibs:Depends}). Blank lines and lines starting with `#` are ignored.
#
# Package names below are the trixie t64-transition names, verified against
# https://deb.debian.org/debian/dists/trixie/{main,non-free}/binary-armhf/
# Packages.xz on 2026-08-16. If a soname bump renames a library in trixie,
# check-deps.sh reports it as missing — update the name here.
#
# Sources for the lists:
# - web888-websdr: Build-Depends in packaging/web888-websdr/debian/control
#   (libfftw3-dev zlib1g-dev libfdk-aac-dev libgps-dev libunwind-dev
#   libsqlite3-dev libcurl4-openssl-dev libssl-dev libconfig++-dev
#   libcrypt-dev) mapped to runtime names.
# - web888-redpitaya: Depends is ${shlibs:Depends}; chroot build deps are
#   libfftw3-dev libeigen3-dev (header-only) libzmq3-dev -> fftw3 + zmq.
# - dumphfdl: Build-Depends in packaging/dumphfdl/debian/control.
#   libacars2 is deliberately NOT here: it is our own package, not in the
#   trixie archive; a libacars bump already rebuilds in the same job.
# - libacars: Build-Depends in packaging/libacars/debian/control.
# - frpc / noip-duc: static binaries (Go repack / vendor prebuilt), no
#   tracked shared-library dependencies (explicit empty entries below).

web888-websdr: libfftw3-double3 zlib1g libfdk-aac2t64 libgps30t64 libunwind8 libsqlite3-0 libcurl4t64 libssl3t64 libconfig++11 libcrypt1
web888-redpitaya: libfftw3-double3 libzmq5
dumphfdl: libconfig++11 libfftw3-double3 libliquid1 libglib2.0-0t64 libzmq5 librdkafka1 libsqlite3-0 libsoapysdr0.8
libacars: zlib1g libxml2 libjansson4
frpc:
noip-duc:
