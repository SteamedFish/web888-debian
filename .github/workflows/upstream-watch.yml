# upstream-watch.yml — daily watch over three kinds of upstream change:
#
#   1. New upstream releases of the third-party packages (libacars, dumphfdl,
#      frpc, noip-duc, acarsdec): bump `version:` in packaging/<name>/upstream.pin.
#   2. The web888-ng pinned pair (web888d from jeskko/web888-ng releases, hw
#      bitstreams from jeskko/web888-ng-hw releases): every upstream release
#      is flagged prerelease, so scripts/ci/check-web888-ng-upstream.sh lists
#      the full release stream (drafts excluded, semver-validated, forward-only)
#      and advances whichever side released, keeping the other side's last pin.
#      Pins live in config/web888-ng/pins.env (lane A owns the file). The
#      rebuild is fired via repository_dispatch (event type
#      `web888-ng-pin-updated`); the publisher is an optional maintainer
#      package and deliberately does NOT dispatch `debs-published`.
#   3. Trixie library refreshes (scripts/ci/check-deps.sh against the tracked
#      runtime libs in packaging/deps-snapshot.conf, state in
#      packaging/deps-snapshot.txt): third-party packages get a `pkgrev:` bump
#      in their upstream.pin and a rebuild; our own packages
#      (web888-websdr, web888-redpitaya) get rebuilt via workflow_call (their
#      version moves via the +ci<run> suffix at build time). This keeps
#      ${shlibs:Depends} >= minimums satisfiable for both fully-upgraded and
#      not-yet-upgraded users (docs/dev/github-ci-apt-repo.md §5).
#
# The commit lands on the branch this workflow ran on; rebuilds are invoked
# via workflow_call because commits pushed with the workflow's GITHUB_TOKEN
# do NOT trigger other workflows (GitHub's recursion guard) — the pin/state
# commit alone would never start a path-filtered build. secrets: inherit is
# required on every caller job: the publish job needs the APT_REPO_GPG_*
# secrets, and called workflows receive no secrets by default.
#
# Permissions: the called publisher workflows declare `contents: write` +
# `actions: write` (their publish jobs fire repository_dispatch). Under
# workflow_call the called workflow only ever receives the calling JOB's
# GITHUB_TOKEN permissions (unlisted scopes default to none, and permissions
# can only be downgraded, never elevated, downstream) — so each caller job
# must carry the full scope the called workflow requests, scoped per job
# here rather than workflow-wide to keep `check` at `actions: none`.
#
# deps-snapshot.txt lives at packaging/ root on purpose: it matches no
# per-package push path filter (packaging/<name>/**), so watch commits never
# cause push-trigger rebuild loops. config/web888-ng/pins.env DOES match
# build-web888d-deb.yml's push filter, but commits pushed with GITHUB_TOKEN
# fire no push events at all — the pair rebuild still arrives only via the
# explicit repository_dispatch job below.

name: upstream-watch

on:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  DEBIAN_MIRROR: https://cdn-aws.deb.debian.org/debian

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      # third-party packages to rebuild (upstream bump or lib refresh), 'none'
      packages: ${{ steps.msg.outputs.packages }}
      # own packages to rebuild (lib refresh), 'none'
      own: ${{ steps.msg.outputs.own }}
      # non-empty when there is something to commit
      commit_msg: ${{ steps.msg.outputs.commit_msg }}
      # 'true' when the web888-ng pinned pair advanced (config/web888-ng/pins.env)
      web888ng: ${{ steps.ng.outputs.changed }}
    env:
      # check-upstream.sh uses it for GitHub API rate limits (optional there)
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Install check dependencies
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends curl jq xz-utils

      - name: Check upstream versions and bump pins
        id: check
        run: |
          set -uo pipefail
          changed=()
          msgs=()
          for name in libacars dumphfdl frpc noip-duc acarsdec; do
            pin="packaging/$name/upstream.pin"
            if [[ ! -f $pin ]]; then
              echo "::warning::$pin missing — skipping $name"
              continue
            fi
            if ! latest=$(bash scripts/ci/check-upstream.sh "$name"); then
              echo "::warning::check-upstream.sh $name failed — skipping"
              continue
            fi
            current=$(grep '^version:' "$pin" | awk '{print $2}')
            echo "$name: current=$current latest=$latest"
            if [[ -n $latest && $latest != "$current" ]]; then
              sed -i "s/^version:.*/version: $latest/" "$pin"
              changed+=("$name")
              msgs+=("$name to $latest")
            fi
          done
          if ((${#changed[@]})); then
            (IFS=,; echo "packages=${changed[*]}" >> "$GITHUB_OUTPUT")
            printf -v joined '%s, ' "${msgs[@]}"
            echo "bumped=${joined%, }" >> "$GITHUB_OUTPUT"
          else
            echo "packages=none" >> "$GITHUB_OUTPUT"
            echo "bumped=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check web888-ng pinned pair (web888d + hw releases)
        id: ng
        run: |
          set -euo pipefail
          pinfile=config/web888-ng/pins.env
          echo "changed=false" >> "$GITHUB_OUTPUT"
          if [[ ! -f $pinfile ]]; then
            echo "::warning::$pinfile missing (lane A owns it) — skipping web888-ng check"
            exit 0
          fi
          if ! out=$(bash scripts/ci/check-web888-ng-upstream.sh --full-pin all); then
            echo "::warning::check-web888-ng-upstream.sh failed — skipping (log above)"
            exit 0
          fi
          # --full-pin emits the complete hash-verified key set only for the
          # side(s) that advanced; merge it and RETAIN the pair partner's pins
          # verbatim (pinned pair, never independently floated).
          if ! grep -q '^WEB888_NG' <<<"$out"; then
            echo "web888-ng pinned pair is up to date"
            exit 0
          fi
          while IFS='=' read -r key value; do
            [[ $key == WEB888_NG* && -n $value ]] || continue
            if grep -q "^$key=" "$pinfile"; then
              sed -i "s|^$key=.*|$key=$value|" "$pinfile"
            else
              echo "$key=$value" >> "$pinfile"
            fi
            echo "bumped $key -> $value"
          done <<<"$(grep '^WEB888_NG' <<<"$out")"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Check trixie dependency libraries
        id: deps
        run: |
          set -euo pipefail
          snapshot=packaging/deps-snapshot.txt
          new=$(mktemp)
          bash scripts/ci/check-deps.sh ALL > "$new"
          {
            echo "bootstrap=false"
            echo "deps3p=none"
            echo "own=none"
            echo "deps_summary="
          } >> "$GITHUB_OUTPUT"

          if [[ ! -s $snapshot ]]; then
            # First run: seed the state file and commit it WITHOUT triggering
            # any rebuild — avoids a one-time thundering herd.
            cp "$new" "$snapshot"
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
            echo "bootstrapped $snapshot:"
            cat "$snapshot"
            exit 0
          fi

          declare -A oldline=()
          while IFS= read -r l; do
            [[ -n $l ]] && oldline[${l%%:*}]=$l
          done < "$snapshot"

          deps3p=()
          own=()
          frags=()
          changed=0
          while IFS= read -r l; do
            [[ -n $l ]] || continue
            key=${l%%:*}
            [[ ${oldline[$key]+x} ]] || { echo "::notice::$key newly tracked — recording baseline only"; continue; }
            [[ ${oldline[$key]} == "$l" ]] && continue
            changed=1
            # build per-lib "lib old -> new" fragment for the commit message
            declare -A ov=()
            for pair in ${oldline[$key]#*: }; do ov[${pair%%=*}]=${pair#*=}; done
            trans=()
            for pair in ${l#*: }; do
              lib=${pair%%=*}
              nv=${pair#*=}
              ovv=${ov[$lib]:-none}
              [[ $ovv == "$nv" ]] || trans+=("$lib $ovv -> $nv")
            done
            printf -v t '%s, ' "${trans[@]}"
            frags+=("$key: ${t%, }")
            echo "$key deps changed: ${t%, }"
            case $key in
              libacars|dumphfdl)
                # bump pkgrev so the refreshed build supersedes the old deb
                pin="packaging/$key/upstream.pin"
                cur=$(grep '^pkgrev:' "$pin" | awk '{print $2}')
                sed -i "s/^pkgrev:.*/pkgrev: $((cur + 1))/" "$pin"
                echo "$key: pkgrev $cur -> $((cur + 1))"
                deps3p+=("$key")
                ;;
              web888-websdr|web888-redpitaya)
                own+=("$key")
                ;;
              *)
                echo "::warning::$key changed but has no rebuild mapping — snapshot updated only"
                ;;
            esac
          done < "$new"

          ((changed)) || exit 0
          cp "$new" "$snapshot"
          ((${#deps3p[@]})) && { (IFS=,; echo "deps3p=${deps3p[*]}" >> "$GITHUB_OUTPUT"); }
          ((${#own[@]})) && { (IFS=,; echo "own=${own[*]}" >> "$GITHUB_OUTPUT"); }
          printf -v summary '%s; ' "${frags[@]}"
          echo "deps_summary=${summary%; }" >> "$GITHUB_OUTPUT"

      - name: Compose outputs and commit message
        id: msg
        run: |
          set -euo pipefail
          # union of upstream-bumped and deps-changed third-party packages
          union=$(echo '${{ steps.check.outputs.packages }},${{ steps.deps.outputs.deps3p }}' \
            | tr ',' '\n' | grep -vx 'none' | grep -v '^$' | sort -u | paste -sd, - || true)
          echo "packages=${union:-none}" >> "$GITHUB_OUTPUT"
          echo "own=${{ steps.deps.outputs.own }}" >> "$GITHUB_OUTPUT"
          parts=()
          b='${{ steps.check.outputs.bumped }}'
          d='${{ steps.deps.outputs.deps_summary }}'
          [[ -n $b ]] && parts+=("bump $b")
          [[ -n $d ]] && parts+=("trixie lib refresh ($d)")
          if [[ '${{ steps.ng.outputs.changed }}' == true ]]; then
            bumped=$(grep '^WEB888_NG.*_VERSION=' config/web888-ng/pins.env | paste -sd' ' -)
            parts+=("bump web888-ng pin ($bumped)")
          fi
          [[ '${{ steps.deps.outputs.bootstrap }}' == true ]] && parts+=("bootstrap deps-snapshot.txt")
          if ((${#parts[@]})); then
            printf -v joined '%s / ' "${parts[@]}"
            echo "commit_msg=upstream-watch: ${joined% / }" >> "$GITHUB_OUTPUT"
          else
            echo "commit_msg=" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push watch updates
        if: steps.msg.outputs.commit_msg != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging/*/upstream.pin packaging/deps-snapshot.txt
          # pin bump of the web888-ng pair (lane-A-owned file; config path is
          # in build-web888d-deb.yml's push.paths, but GITHUB_TOKEN pushes
          # fire no push events — the rebuild arrives via the explicit
          # repository_dispatch job below, like the deps-snapshot design)
          [[ '${{ steps.ng.outputs.changed }}' == true ]] && git add config/web888-ng/pins.env
          git commit -m "${{ steps.msg.outputs.commit_msg }}"
          # checkout may be a detached HEAD (schedule events) — push via HEAD
          git push origin "HEAD:${{ github.ref_name }}"

  # Rebuild + republish the bumped/lib-refreshed third-party packages through
  # the reusable workflow (accepts a comma-separated package list).
  rebuild:
    needs: check
    if: needs.check.outputs.packages != 'none'
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/build-thirdparty-debs.yml
    with:
      package: ${{ needs.check.outputs.packages }}
    secrets: inherit

  # Lib-refreshed own packages rebuild through their own workflows via
  # workflow_call (they carry no inputs; versions move via +ci<run>).
  websdr-rebuild:
    needs: check
    if: contains(needs.check.outputs.own, 'web888-websdr')
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/build-websdr-deb.yml
    secrets: inherit

  redpitaya-rebuild:
    needs: check
    if: contains(needs.check.outputs.own, 'web888-redpitaya')
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/build-redpitaya-deb.yml
    secrets: inherit

  # web888-ng pinned pair advanced: fire a repository_dispatch for
  # build-web888d-deb.yml. Unlike the rebuild jobs above this does NOT lead
  # to an image rebuild — web888d/bitstream are optional packages outside
  # the fixed image list, so their publish step fires no `debs-published`.
  web888-ng-rebuild:
    needs: check
    if: needs.check.outputs.web888ng == 'true'
    permissions:
      actions: write   # repository_dispatch only
    runs-on: ubuntu-24.04
    steps:
      - name: Fire repository_dispatch for web888-ng pin update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/dispatches" \
            -f event_type=web888-ng-pin-updated
