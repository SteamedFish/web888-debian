# build-boot-deb.yml — build web888-boot_*_armhf.deb (source-built FSBL +
# mainline U-Boot v2026.07 SSBL packed into boot.bin, plus boot.scr/uEnv.txt
# and web888.dtb compiled from config/web888.dts) on GitHub-hosted
# ubuntu-24.04 and publish it to the flat gh-pages APT repo.
#
# Build order mirrors build-all.sh: bootgen tool (exact recipe from
# build-all.sh lines 115-123) -> build-uboot.sh -> build-fsbl.sh ->
# build-bootbin.sh uboot -> build-boot-deb.sh. build-boot-deb.sh also
# compiles web888.dtb via write-dtb.sh, so the Debian kernel source tree
# is fetched first (FETCH_ONLY=1 — unpack only, nothing compiled; this is
# what lets DEB_SOURCE=apt image builds skip the kernel tree entirely).
# build-boot-deb.sh packages inside the armhf chroot, so
# mk-websdr-chroot.sh runs first (the chroot
# provides dpkg-buildpackage only; nothing arch-specific is compiled there).
#
# Version: committed changelog version + "+ci${GITHUB_RUN_NUMBER}" (CI
# checkout only, never committed). See docs/dev/github-ci-apt-repo.md.
#
# Job chain: preflight -> build -> smoke -> publish. The smoke job
# (scripts/ci/qemu-smoke-deb.sh) boots the freshly built deb in QEMU before
# it is published, so a deb that breaks boot never reaches the APT repo.
# QEMU skips the FSBL (loads U-Boot directly), so an FSBL-side regression
# inside boot.bin is NOT caught here — hardware gate only.

name: build-boot-deb

on:
  push:
    branches: [master]
    # Mirrored in scripts/ci/deb-trigger-paths.txt (build-image.yml preflight
    # skips push-triggered image builds when a push hits these paths) -
    # keep in sync when adding/removing paths.
    paths:
      - 'scripts/fetch-upstream-src.sh'
      - 'scripts/mk-websdr-chroot.sh'
      - 'scripts/build-uboot.sh'
      - 'scripts/build-fsbl.sh'
      - 'scripts/build-bootbin.sh'
      - 'scripts/build-boot-deb.sh'
      - 'scripts/write-dtb.sh'
      - 'scripts/build-kernel-6.12.sh'
      - 'config/u-boot/**'
      - 'config/web888.dts'
      - 'packaging/web888-boot/**'
      - 'resources/reference/embeddedsw-zynq-fsbl/**'
      - 'resources/reference/redpitaya-fsbl-hooks/**'
      - 'scripts/ci/stamp-changelog.sh'
      - 'scripts/ci/qemu-smoke-deb.sh'
      - '.github/workflows/build-boot-deb.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # publish job fires repository_dispatch (image rebuild)

concurrency:
  group: build-boot
  cancel-in-progress: false

env:
  DEBIAN_MIRROR: https://cdn-aws.deb.debian.org/debian

jobs:
  # Skip the build when this push does not change anything the deb depends
  # on: preflight-skip.sh hashes the git tree of the input paths and compares
  # it against apt/build-manifest.json on gh-pages, which the publish job
  # updates after every successful publish. workflow_dispatch/workflow_call
  # always build; a missing manifest (nothing published yet) never skips.
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      hash: ${{ steps.check.outputs.hash }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: >-
          bash scripts/ci/preflight-skip.sh web888-boot
          scripts/fetch-upstream-src.sh
          scripts/mk-websdr-chroot.sh
          scripts/build-uboot.sh
          scripts/build-fsbl.sh
          scripts/build-bootbin.sh
          scripts/build-boot-deb.sh
          scripts/write-dtb.sh
          scripts/build-kernel-6.12.sh
          config/u-boot
          config/web888.dts
          packaging/web888-boot
          resources/reference/embeddedsw-zynq-fsbl
          resources/reference/redpitaya-fsbl-hooks
          scripts/ci/stamp-changelog.sh
          scripts/ci/qemu-smoke-deb.sh
          .github/workflows/build-boot-deb.yml

  build:
    needs: preflight
    if: ${{ needs.preflight.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      # gcc-arm-none-eabi + libnewlib-arm-none-eabi: the FSBL toolchain.
      # build-fsbl.sh probes NEWLIB_SYSROOT (override exists in the script);
      # on Ubuntu these packages work natively — they only need to be present.
      - name: Install build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            debootstrap qemu-user-static binfmt-support rsync git dpkg-dev \
            crossbuild-essential-armhf gcc-arm-none-eabi libnewlib-arm-none-eabi \
            device-tree-compiler bc flex bison libssl-dev python3 patch

      - name: Stamp CI package version
        run: |
          ver=$(dpkg-parsechangelog -l packaging/web888-boot/debian/changelog -S Version)
          bash scripts/ci/stamp-changelog.sh packaging/web888-boot/debian "${ver}+ci${GITHUB_RUN_NUMBER}"

      - name: Fetch pinned U-Boot source
        run: bash scripts/fetch-upstream-src.sh u-boot

      - name: Build bootgen (build-all.sh recipe)
        run: |
          [[ -d work/bootgen ]] || git clone --depth 1 https://github.com/Xilinx/bootgen work/bootgen
          make -C work/bootgen \
            CFLAGS="-O -Wall -Wno-error=incompatible-pointer-types -Wno-error=int-conversion -Wno-error=implicit-function-declaration" \
            CXXFLAGS="-std=c++14 -O -Wall -Wno-reorder -Wno-deprecated-declarations -Wno-aligned-new -Wno-misleading-indentation -Wno-class-memaccess"
          mkdir --parents work/tools
          cp work/bootgen/build/bin/bootgen work/tools/

      - name: Build U-Boot (SSBL)
        run: bash scripts/build-uboot.sh

      - name: Build FSBL
        run: bash scripts/build-fsbl.sh

      - name: Pack boot.bin (uboot chain)
        run: bash scripts/build-bootbin.sh uboot

      - name: Fetch Debian kernel source tree (web888.dtb inputs only, no compile)
        run: FETCH_ONLY=1 bash scripts/build-kernel-6.12.sh

      - name: Create the armhf packaging chroot
        run: bash scripts/mk-websdr-chroot.sh

      - name: Build the boot deb
        run: bash scripts/build-boot-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: debs-boot
          path: output/boot/*.deb

  # Pre-publish gate: boot the freshly built deb in QEMU. The baseline
  # image is assembled the DEB_SOURCE=apt way from the PUBLISHED repo, the
  # deb under test is overlaid via chroot dpkg -i, and the image must reach
  # the 'web888 login:' prompt — a deb that breaks boot never goes live.
  # Gated on APT_REPO_ENABLED like publish: without the repo there is no
  # baseline to pull. FSBL is NOT covered (QEMU loads U-Boot directly — see
  # scripts/test-qemu.sh); that residual risk is hardware-gate only.
  smoke:
    needs: [preflight, build]
    if: ${{ vars.APT_REPO_ENABLED == 'true' && needs.preflight.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Keep byte-identical with build-image.yml's "Install host tooling" +
      # repo sanity check: the smoke job runs the same apt-mode
      # build-all.sh and needs exactly the same host tools.
      - name: Install host tooling
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            debootstrap qemu-user-static binfmt-support qemu-system-arm \
            gcc-arm-linux-gnueabihf gcc-arm-none-eabi binutils-arm-none-eabi \
            device-tree-compiler u-boot-tools dosfstools e2fsprogs parted \
            cpio rsync wget git dpkg-dev xz-utils jq curl python3 \
            libarchive-tools
          sudo modprobe loop

      - name: Sanity-check the APT repo is reachable
        run: |
          for i in {1..10}; do
            curl -fsSL --max-time 20 https://web888.steamedfish.org/apt/InRelease -o /dev/null && exit 0
            echo "repo not reachable yet (Pages deploy window?) — retry $i/10"
            sleep 30
          done
          echo "Error: APT repo unreachable" >&2; exit 1

      - uses: actions/download-artifact@v4
        with:
          name: debs-boot
          path: debs/

      - name: QEMU smoke gate
        run: bash scripts/ci/qemu-smoke-deb.sh debs/*.deb

  publish:
    needs: [preflight, build, smoke]
    if: ${{ vars.APT_REPO_ENABLED == 'true' && needs.preflight.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # serialize APT-repo publishes across all workflows — concurrent writers
    # to gh-pages would race the git push and the Packages/Release index.
    concurrency:
      group: apt-repo-publish
      cancel-in-progress: false
    steps:
      # Publish tooling (scripts/ci/*) intentionally tracks master HEAD, not the
      # trigger sha: a publish-script fix must not require a full rebuild round.
      - name: Check out master (publish tooling)
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Check out gh-pages into repo/
        run: |
          mkdir -p repo
          cd repo
          git init -q
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git fetch -q origin gh-pages 2>/dev/null; then
            git checkout -q gh-pages
            # keep the existing tree: the repo accumulates packages from
            # every publisher workflow; update-apt-repo.sh prunes per package.
          else
            git checkout -q --orphan gh-pages
            # fresh branch: drop anything that is not .git
            find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          fi

      - name: Install repo tooling
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends dpkg-dev apt-utils

      - uses: actions/download-artifact@v4
        with:
          name: debs-boot
          path: debs/

      - uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.APT_REPO_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.APT_REPO_GPG_PASSPHRASE }}

      - name: Update the APT repo
        run: APT_GPG_KEY_ID=${{ secrets.APT_REPO_GPG_KEY_ID }} bash scripts/ci/update-apt-repo.sh debs/ repo/ apt

      - name: Record the published inputs hash
        run: |
          manifest=repo/apt/build-manifest.json
          [ -f "$manifest" ] || echo '{}' > "$manifest"
          jq --arg k web888-boot --arg h '${{ needs.preflight.outputs.hash }}' \
            '.[$k] = $h' "$manifest" > "$manifest.tmp"
          mv "$manifest.tmp" "$manifest"

      - name: Commit and push gh-pages
        run: |
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "==> no repo changes — nothing to publish"
            exit 0
          fi
          pkgs=$(ls ./apt/*.deb | cut -d_ -f1 | sort -u | paste -sd, -)
          git commit -m "apt-repo: add $pkgs from ${{ github.workflow }} run ${{ github.run_number }}"
          git push origin gh-pages
          # A fresh package set is live — trigger an image rebuild.
          # (repository_dispatch is one of the two events GITHUB_TOKEN may
          # fire; requires actions: write.)
          GH_TOKEN=${{ secrets.GITHUB_TOKEN }} gh api \
            "repos/${{ github.repository }}/dispatches" -f event_type=debs-published
